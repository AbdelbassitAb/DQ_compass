[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-compass"
version = "1.0.0"
description = "Plug-and-play data quality control layer for End-User Computing (EUC) applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas", "pyyaml", "flask", "openpyxl"]

[project.scripts]
dqcompass = "cli:main"

[tool.setuptools]
py-modules = ["connectors", "controls", "dq_engine", "mapping", "cli"]
packages = ["rule_authoring", "reporting"]

[tool.setuptools.package-data]
rule_authoring = ["templates/*.html", "static/*"]
